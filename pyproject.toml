[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "p4-history-mcp"
version = "0.2.0"
description = "Local Git-backed history for pending Perforce changelists, designed for AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp>=2.2,<3", "filelock>=3.16,<4", "platformdirs>=4,<5", "pydantic>=2.11,<3"]

[project.scripts]
p4-history = "p4_history.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
windows-build = [
    "pyinstaller>=6.22,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/p4_history"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
